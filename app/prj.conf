# USB device stack (the "next" stack; the legacy one is deprecated) with HID.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# Serial number descriptor is derived from the SoC unique id.
CONFIG_HWINFO=y

# The OpenSDA CDC port is the console; the command protocol speaks over it.
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETLINE=y

# Keep logging quiet so it does not interleave with protocol replies. Warnings
# and errors still surface, and every reply is prefixed OK/ERR so a host parser
# can ignore anything else.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_HID_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BUILD_OUTPUT_HEX=y
